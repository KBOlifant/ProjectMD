<script type="module">
    import { animate, stagger } from "motion"

    const grid = document.querySelector(".example")
    const cells = grid.querySelectorAll("button")

    // Read the number of columns and rows from the CSS grid
    const style = getComputedStyle(grid)
    const columns = style.gridTemplateColumns.split(" ").length
    const rows = style.gridTemplateRows.split(" ").length

    // Fade in from the centre of the grid
    animate(
        cells,
        { opacity: 1, scale: [0.5, 1] },
        { delay: stagger(0.05, { grid: [columns, rows], from: "center" }) }
    )

    // Ripple outwards from the clicked cell
    cells.forEach((cell, i) => {
        cell.addEventListener("click", () => {
            animate(
                cells,
                { scale: [1, 0.4, 1] },
                {
                    duration: 0.6,
                    delay: stagger(0.05, { grid: [columns, rows], from: i }),
                }
            )

            // Mark the origin cell
            grid.querySelector(".stagger-origin")?.classList.remove("stagger-origin")
            cell.classList.add("stagger-origin")
        })
    })
</script>

    .example {

        grid-template-rows: repeat(6, clamp(22px, 6vw, 40px));
        gap: clamp(4px, 1.4vw, 10px);

    .example button {
